[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "app/static"

[build.environment]
  PYTHON_VERSION = "3.11"
  NETLIFY = "true"

[functions]
  included_files = [
    "app/**",
    "database/**",
    "schedulesync.db"
  ]

# Netlify redirects for FastAPI backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/api/share/:splat"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/.netlify/functions/api/docs"
  status = 200

[[redirects]]
  from = "/redoc"
  to = "/.netlify/functions/api/redoc"
  status = 200

[[redirects]]
  from = "/openapi.json"
  to = "/.netlify/functions/api/openapi.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
